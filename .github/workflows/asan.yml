name: asan-reproduction

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect:
    name: 编译并运行全部 ASan 用例
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 clang（用例 07 需要假栈机制，GCC 未实现）
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq clang
          fi

      - name: 打印工具链版本
        run: |
          make check-env
          uname -a

      - name: 采集运行环境（硬件 / OS / 内核 / 编译器 / 设置）
        run: bash scripts/env_report.sh

      - name: 构建用例
        run: make

      - name: 运行用例（预期全部崩溃，因此允许非零退出）
        run: bash scripts/run_all.sh || true

      - name: 把报告回显到日志
        run: cat reports/summary.md

      - name: 测量运行时间与内存开销（复现 Figure 2 / Table 1）
        run: bash bench/run_bench.sh

      - name: 对照实验：隔离区大小对 UAF 可检出性的影响（复现 §3.5 / §4.3）
        run: bash scripts/exp_quarantine.sh

      - name: 回显开销与环境
        run: |
          cat docs/measured/performance.md
          cat docs/measured/environment.md
          cat docs/measured/exp_quarantine.md

      - name: 上传报告产物
        uses: actions/upload-artifact@v4
        with:
          name: asan-reports
          path: reports/
          if-no-files-found: warn

      - name: 上传环境与开销结果
        uses: actions/upload-artifact@v4
        with:
          name: measured-docs
          path: docs/measured/
          if-no-files-found: warn
