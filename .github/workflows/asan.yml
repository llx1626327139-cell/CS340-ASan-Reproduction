name: asan-reproduction

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect:
    name: Build and run every ASan case
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install clang (case 07 needs the fake stack, which GCC lacks)
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq clang
          fi

      - name: Print toolchain versions
        run: |
          make check-env
          uname -a

      - name: Collect the runtime environment (hardware / OS / kernel / compiler / settings)
        run: bash scripts/env_report.sh

      - name: Build the cases
        run: make

      - name: Run the cases (all are expected to crash, so a non-zero exit is fine)
        run: bash scripts/run_all.sh || true

      - name: Echo the report into the log
        run: cat reports/summary.md

      - name: Measure runtime and memory overhead (reproduces Figure 2 / Table 1)
        run: bash bench/run_bench.sh

      - name: Extension - effect of the redzone size on overhead (single-factor sweep)
        run: bash bench/ext_redzone.sh

      - name: Control experiment - effect of the quarantine size on UAF detectability (reproduces 3.5 / 4.3)
        run: bash scripts/exp_quarantine.sh

      - name: Echo the overhead and environment results
        run: |
          cat docs/measured/performance.md
          cat docs/measured/extension.md
          cat docs/measured/environment.md
          cat docs/measured/exp_quarantine.md

      - name: Upload the report artefacts
        uses: actions/upload-artifact@v4
        with:
          name: asan-reports
          path: reports/
          if-no-files-found: warn

      - name: Upload the environment and overhead results
        uses: actions/upload-artifact@v4
        with:
          name: measured-docs
          path: docs/measured/
          if-no-files-found: warn
